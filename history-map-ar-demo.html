 window.addEventListener('message',event=>{if(!frame||event.source!==frame.contentWindow||event.origin!==location.origin)return;const message=event.data;if(!message||typeof message.type!=='string')return;switch(message.type){case 'history-ar-ready':clearTimeout(arTimer);$('historyARStatus').textContent='对准完整地图；点击模型进入对应全景。';break;case 'history-ar-found':$('historyARStatus').textContent='地图已识别，点击立体模型或金色标记进入全景。';break;case 'history-ar-lost':$('historyARStatus').textContent='暂时丢失地图，请保持光线充足并重新对准。';break;case 'history-ar-error':status(message.message||'AR启动失败，请使用静态地图。');stopAR();break;case 'history-ar-hidden':stopAR();break;case 'history-ar-navigate':navigate(message.sceneId);break}});
 for(const event of data.events){const point=element('button',{'class':'history-map-point','aria-label':event.name+' '+event.year+'，进入全景',title:event.name+' · '+event.year});point.style.left=(event.x*100)+'%';point.style.top=(event.y*100)+'%';point.onclick=()=>navigate(event.sceneId);$('historyMapPoints').append(point);const card=element('button',{'class':'history-map-event','aria-label':'进入 '+event.name});const year=element('small'),name=element('strong'),place=element('span');year.textContent=event.year;name.textContent=event.name;place.textContent=event.place;card.append(year,name,place);card.onclick=()=>navigate(event.sceneId);$('historyMapEvents').append(card)}
 $('historyMapImage').src=data.embeddedImage||data.image;$('historyMapDownload').href=data.embeddedImage||data.image;$('historyMapImage').onerror=()=>{status('地图图片加载失败，仍可使用下方历史事件按钮进入全景。')};
 $('historyReturnMuseum').onclick=()=>navigate('museum');$('historyReturnPresent').onclick=()=>navigate('present');$('historyMapClose').onclick=()=>close();$('historyMapDone').onclick=()=>close();$('historyARStart').onclick=startAR;$('historyARClose').onclick=stopAR;
 function keyboard(event){if(event.key==='Escape'){event.preventDefault();event.stopPropagation();arOpen?stopAR():close();return}if(event.key==='Tab'){const area=arOpen?$('historyARModal'):root;const items=[...area.querySelectorAll('button,a[href],iframe')].filter(el=>!el.hidden&&!el.disabled&&el.getClientRects().length);const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}event.stopPropagation()}
 root.addEventListener('keydown',keyboard);$('historyARModal').addEventListener('keydown',keyboard);document.addEventListener('visibilitychange',()=>{if(document.hidden&&arOpen)stopAR()});window.addEventListener('pagehide',()=>{if(frame)frame.remove()});
 window.redHistoryMap={open,close,stopAR,startAR,setHooks:value=>hooks=value||{},navigate,getSnapshot:()=>({opened,arOpen,capability})};
})();

</script>
<!-- HISTORY-MAP-END --><script>const mapData=JSON.parse(document.getElementById('history-map-data').textContent);let demoViewer=null;function panorama(name){const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=1024;const ctx=canvas.getContext('2d'),g=ctx.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#b4a484');g.addColorStop(.6,'#66332b');g.addColorStop(1,'#261b18');ctx.fillStyle=g;ctx.fillRect(0,0,2048,1024);ctx.fillStyle='#fff1c8';ctx.font='46px serif';ctx.textAlign='center';ctx.fillText(name+' · 全景占位',1024,510);return canvas.toDataURL()}const demoScenes=Object.fromEntries([...mapData.events,{sceneId:'museum',name:'展览厅'},{sceneId:'present',name:'现代中国'}].map(e=>[e.sceneId,{type:'equirectangular',panorama:panorama(e.name),autoLoad:true}]));if(window.pannellum)demoViewer=pannellum.viewer('demoPanorama',{default:{firstScene:'museum',autoLoad:true,showControls:true},scenes:demoScenes});window.redHistoryMap.setHooks({onNavigate:id=>{if(demoViewer)demoViewer.loadScene(id);document.getElementById('demoTitle').textContent=demoScenes[id]?((mapData.events.find(e=>e.sceneId===id)||{name:id==='museum'?'展览厅':'现代中国'}).name):id}});document.querySelectorAll('#demoTimeline button').forEach(b=>b.onclick=()=>window.redHistoryMap.open());</script></body></html>
