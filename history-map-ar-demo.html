()}}\n function center(entry,ctx){const point=entry.root.object3D.localToWorld(new THREE.Vector3(0,0,.025)).project(ctx.scene.camera);if(point.z\u003c-1||point.z>1)return null;return{x:ctx.rect.left+(point.x+1)*ctx.rect.width/2,y:ctx.rect.top+(1-point.y)*ctx.rect.height/2}}\n function pick(x,y){const ctx=context();if(!ctx||!ctx.rect.width||!ctx.rect.height)return null;raycaster||=new THREE.Raycaster();raycaster.setFromCamera(new THREE.Vector2((x-ctx.rect.left)/ctx.rect.width*2-1,1-(y-ctx.rect.top)/ctx.rect.height*2),ctx.scene.camera);\n  const roots=[...entries.values()].map(e=>e.root.object3D),hits=raycaster.intersectObjects(roots,true);\n  for(const hit of hits){if(!visible(hit.object))continue;for(let p=hit.object;p;p=p.parent){for(const [id,entry]of entries)if(p===entry.root.object3D)return id}}\n  // 小尺寸占位模型保留最少24px的触屏容错；优先使用真实网格命中。\n  let best=null,distance=24;for(const [id,entry]of entries){if(!visible(entry.root.object3D))continue;const p=center(entry,ctx);if(!p)continue;const d=Math.hypot(x-p.x,y-p.y);if(d\u003cdistance){best=id;distance=d}}return best;\n }\n function select(id){selected=id;for(const [key,entry]of entries)entry.ring.setAttribute('visible',key===id);if(id)onStatus('已选择'+entries.get(id).name+'：沿圆形箭头拖动旋转，双击模型进入全景。')}\n function setZoom(value){zoom=Math.max(1,Math.min(3,value));container.style.transform=`scale(${zoom})`}\n const distance=()=>{const [a,b]=[...pointers.values()];return Math.hypot(a.x-b.x,a.y-b.y)};\n function down(event){if(disposed||event.button>0)return;event.preventDefault();surface.setPointerCapture?.(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(pointers.size>1){lastTap=null;drag=null;if(pointers.size===2)pinch={distance:Math.max(1,distance()),zoom};return}const hit=pick(event.clientX,event.clientY),ctx=context(),p=selected&&ctx&&center(entries.get(selected),ctx);\n  // 已选模型周围提供至少直径240px的拖动区；其他模型的实际命中始终优先。\n  const nearSelected=selected&&p&&Math.hypot(event.clientX-p.x,event.clientY-p.y)  async function support(){capability='';const secure=window.isSecureContext&&location.protocol!=='file:';if(!secure||!navigator.mediaDevices?.getUserMedia){capability='AR需要HTTPS或本机localhost，并且浏览器支持摄像头；当前可浏览静态地图。';return false}if(/MicroMessenger/i.test(navigator.userAgent)){capability='微信内置浏览器的摄像头支持可能受限，建议用系统浏览器打开。'}try{const devices=await navigator.mediaDevices.enumerateDevices();if(devices.length&&!devices.some(d=>d.kind==='videoinput')){capability='没有检测到摄像头，可直接点击地图进入全景。';return false}}catch{}return true}

/* 静态网站的双设备同步：PeerJS仅用于信令，WebRTC仅传递场景编号。
 * 电脑先创建配对码，手机输入该码连接；连接保持至刷新或主动断开。
 * 公共信令/网络受限时明确报错，手机本地AR仍可独立使用。 */
(() => {
 'use strict'; const $=id=>document.getElementById(id); if(!$('historyPairHost'))return;
 let peer=null,connection=null,serial=0,loader=null;const pending=new Map(),seen=new Set();
 const allowed=new Set(['museum','present',...JSON.parse($('history-map-data').textContent).events.map(e=>e.sceneId)]);
 const status=text=>{$('historyPairStatus').textContent=text};
 function load(){if(window.Peer)return Promise.resolve();if(!loader)loader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='vendor/peerjs.min.js';script.onload=()=>window.Peer?resolve():reject(Error('同步组件不可用'));script.onerror=()=>reject(Error('同步组件下载失败'));document.head.append(script)}).catch(error=>{loader=null;throw error});return loader}
 function disconnect(){serial++;connection?.close();peer?.destroy();peer=connection=null;pending.forEach(p=>{clearTimeout(p.timer);p.resolve(false)});pending.clear();seen.clear();$('historyPairCode').textContent='尚未配对';status('电脑点击“创建配对码”，手机输入此码连接。')}
 function bind(conn,host){connection=conn;conn.on('open',()=>status(host?'手机已连接。点击手机AR模型将同步切换电脑全景。':'已连接电脑。点击AR模型将同步切换两端全景。'));conn.on('close',()=>{if(connection===conn){connection=null;status('连接已断开，请重新配对。')}});conn.on('error',()=>status('连接失败，请重新配对或更换网络。'));
  conn.on('data',async message=>{if(!message||typeof message!=='object')return;
   if(message.type==='scene-error'){status('电脑跳转失败，请检查电脑页面或重新点击。');return}
   if(message.type==='ack'&&typeof message.id==='string'){const p=pending.get(message.id);if(p){clearTimeout(p.timer);pending.delete(message.id);p.resolve(message.ok===true)}return}
   if(!host||message.type!=='scene'||!allowed.has(message.sceneId)||typeof message.id!=='string'||message.id.length>80)return;
   if(seen.has(message.id)){conn.send({type:'ack',id:message.id,ok:true});return}seen.add(message.id);if(seen.size>100)seen.delete(seen.values().next().value);
   if(conn.open)conn.send({type:'ack',id:message.id,ok:true});status('已收到手机指令，正在切换场景…');try{await window.redHistoryMap.navigate(message.sceneId);status('电脑已进入对应全景。')}catch{status('电脑跳转失败，请重试。');if(conn.open)conn.send({type:'scene-error',id:message.id})}
  });
 }
 async function connect(host){disconnect();const attempt=serial;let code;if(host){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);code=bytes[0].toString(36).padStart(7,'0').toUpperCase()}else{code=$('historyPairInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{7}$/.test(code)){status('请输入电脑上显示的7位配对码。');return}}
  status('正在连接同步服务…');try{await load();if(attempt!==serial)return;peer=new Peer(host?'redheritage-'+code:undefined,{debug:0});const current=peer;
   const timer=setTimeout(()=>{if(current===peer&&!connection?.open)status('配对超时。请确认两端在线；当前网络可能限制WebRTC，请换用其他网络。')},20000);
   peer.on('open',()=>{if(attempt!==serial)return;if(host){clearTimeout(timer);$('historyPairCode').textContent=code;status('请在手机地图页面输入此配对码；勿向无关人员分享。')}else bind(peer.connect('redheritage-'+code,{reliable:true,serialization:'json'}),false)});
   peer.on('connection',conn=>{if(!host||connection){conn.close();return}clearTimeout(timer);bind(conn,true)});
   peer.on('error',error=>{if(attempt!==serial)return;clearTimeout(timer);status(error.type==='peer-unavailable'?'找不到电脑，请核对配对码并保持电脑页面打开。':'同步服务连接失败（'+String(error.type||'网络错误')+'），可继续在手机独立参观。')});peer.on('disconnected',()=>{if(attempt===serial)status('同步信令已断开；如无法同步，请重新配对。')});
  }catch(error){status(error.message)}
 }
 async function sendScene(sceneId){if(!allowed.has(sceneId)||!connection?.open)return false;const id=crypto.randomUUID();return new Promise(resolve=>{const timer=setTimeout(()=>{pending.delete(id);status('电脑未确认跳转，请检查电脑连接。手机将继续进入全景。');resolve(false)},2500);pending.set(id,{resolve,timer});try{connection.send({type:'scene',sceneId,id})}catch{clearTimeout(timer);pending.delete(id);resolve(false)}})}
 $('historyPairHost').onclick=()=>connect(true);$('historyPairJoin').onclick=()=>connect(false);$('historyPairDisconnect').onclick=disconnect;
 window.redHistoryPair={sendScene,disconnect,isConnected:()=>!!connection?.open};window.addEventListener('pagehide',disconnect);
})();

<!-- HISTORY-MAP-END --><script>const mapData=JSON.parse(document.getElementById('history-map-data').textContent);let demoViewer=null;function panorama(name){const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=1024;const ctx=canvas.getContext('2d'),g=ctx.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#b4a484');g.addColorStop(.6,'#66332b');g.addColorStop(1,'#261b18');ctx.fillStyle=g;ctx.fillRect(0,0,2048,1024);ctx.fillStyle='#fff1c8';ctx.font='46px serif';ctx.textAlign='center';ctx.fillText(name+' · 全景占位',1024,510);return canvas.toDataURL()}const demoScenes=Object.fromEntries([...mapData.events,{sceneId:'museum',name:'展览厅'},{sceneId:'present',name:'现代中国'}].map(e=>[e.sceneId,{type:'equirectangular',panorama:panorama(e.name),autoLoad:true}]));if(window.pannellum)demoViewer=pannellum.viewer('demoPanorama',{default:{firstScene:'museum',autoLoad:true,showControls:true},scenes:demoScenes});window.redHistoryMap.setHooks({onNavigate:id=>{if(demoViewer)demoViewer.loadScene(id);document.getElementById('demoTitle').textContent=demoScenes[id]?((mapData.events.find(e=>e.sceneId===id)||{name:id==='museum'?'展览厅':'现代中国'}).name):id}});document.querySelectorAll('#demoTimeline button').forEach(b=>b.onclick=()=>window.redHistoryMap.open());</script></body></html>
