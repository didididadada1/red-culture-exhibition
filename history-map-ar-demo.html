1;min-width:20px;max-width:40px;min-height:20px;border:2px solid #f5d483;border-radius:50%;background:transparent;box-shadow:0 0 0 3px #f1c40f33;cursor:pointer;padding:0}.history-map-point:hover,.history-map-point:focus-visible{background:#f1c40f55;outline:3px solid #fff5bc;box-shadow:0 0 22px #f1c40f}.history-map-events{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;margin:18px auto 10px;max-width:1200px}.history-map-event{border:1px solid #ceb386;border-radius:6px;background:#ffffff8c;padding:10px;text-align:left;color:#643e31;cursor:pointer}.history-map-event small,.history-map-event strong,.history-map-event span{display:block}.history-map-event small{color:#a57e40;font-size:10px}.history-map-event strong{color:#8b2c25;font-size:13px}.history-map-event span{font-size:10px;color:#8d7a60}.history-map-event:hover{background:#fff3cb}.history-map-now{display:flex;justify-content:center;gap:12px;margin:16px 0}.history-map-now button{border:0;color:#8b2c25;background:transparent;padding:7px 12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.history-map-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;flex:none;border-top:1px solid #c8aa752d}.history-map-footer>span{font-size:11px;color:#8b7356;max-width:65ch}.history-map-footer>div{display:flex;gap:8px;flex-wrap:wrap;flex:none}.history-map-footer button,.history-map-footer a{font:12px 'Microsoft YaHei',sans-serif;border:1px solid #bd9455;border-radius:5px;background:transparent;color:#8b3028;padding:10px 14px;text-decoration:none;cursor:pointer}.history-map-footer #historyARStart{background:#96342b;border-color:#96342b;color:#fff1d3}.history-map-modal button:focus-visible,.history-map-modal a:focus-visible,.history-ar-modal button:focus-visible{outline:3px solid #d1a948;outline-offset:3px}.history-ar-modal{background:#000;z-index:1210}.history-ar-toolbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:linear-gradient(#000b,transparent);color:white}.history-ar-toolbar span{font-size:12px}.history-ar-toolbar button{flex:none;border:1px solid #e6c17c;background:#632b26bb;color:#fff0d2;border-radius:5px;padding:10px;cursor:pointer}#historyARFrameHost,#historyARFrameHost iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.history-progress-hint{font:10px 'Microsoft YaHei',sans-serif;color:#e4c17d;background:transparent;border:0;padding:6px;cursor:pointer}.history-progress-hint:hover{color:#fff0bd}

.history-pair-panel>div{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.history-pair-panel button,.history-pair-panel input{min-height:40px;border:1px solid #b99862;border-radius:5px;padding:6px 10px;background:#fff8e8;color:#633427;box-sizing:border-box}.history-pair-panel input{width:175px;text-transform:uppercase}.history-pair-panel strong{display:block}#historyPairCode{font:700 18px monospace;color:#ad3c30}.is-map-fullscreen .history-pair-panel{display:none}
@media(max-width:600px){.history-pair-panel{margin:0 12px 8px;padding:8px}.history-pair-panel>div{gap:5px}.history-pair-panel button{font-size:12px}}

/* 整图最大化且不裁切目标图；返回键仅占右上角，不再预留整条顶部空白。 */
.is-map-fullscreen .history-map-full-hint{bottom:env(safe-area-inset-bottom,0px);left:4px;right:4px;min-height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.3}.is-map-fullscreen .history-map-full-exit{background:#382823cc;right:max(8px,env(safe-area-inset-right,0px))}

.history-ar-toolbar{transition:filter .28s ease}.history-ar-modal.is-preview-open>.history-ar-toolbar{filter:blur(5px);pointer-events:none}

<script id="history-map-data" type="application/json">{"image":"history-assets/red-history-map.png","displayImage":"history-assets/red-history-map-display.jpg","target":"history-assets/red-history-map.mind","width":1448,"height":1086,"events":[{"sceneId":"redboat","name":"红船","year":"1921","place":"嘉兴南湖","x":0.7672651933701657,"y":0.5616942909760589,"model":"ar-models/redboat-object.glb","detailModel":"ar-models/redboat-scene.glb","modelScale":0.105,"rotation":"0 0 0","summary":"中共一大在南湖完成议程。","introduction":"嘉兴南湖是中国共产党诞生的重要纪念地。1921年，中共一大在上海召开，会议受到干扰后，代表们转移到南湖的一艘游船上继续议程，完成大会议程。红船见证了建党这一历史起点，也承载着开天辟地、敢为人先的首创精神，坚定理想、百折不挠的奋斗精神，立党为公、忠诚为民的奉献精神。保护相关遗址、文献与实物，有助于理解初心使命，传承红色记忆。","introSource":"https://www.12371.cn/special/zgjs/hcjs/"},{"sceneId":"jinggangshan","name":"井冈山","year":"1927","place":"井冈山","x":0.5290055248618785,"y":0.7403314917127072,"model":"ar-models/jinggangshan-object.glb","detailModel":"ar-models/jinggangshan-scene.glb","modelScale":0.1,"rotation":"0 0 0","summary":"从革命根据地的开创走近井冈山精神。","introduction":"井冈山地处湘赣边界，是中国革命的重要根据地。1927年秋，毛泽东率领秋收起义部队来到这里，探索建立农村革命根据地。1928年，朱德、陈毅率领的部队与毛泽东领导的部队在井冈山会师。在艰苦条件下，军民开展武装斗争、土地革命和根据地建设，逐步积累农村包围城市、武装夺取政权的实践经验。旧居与日常器物记录着军民互助、艰苦奋斗的岁月。","introSource":"https://www.12371.cn/2022/04/01/ARTI1648804146759909.shtml"},{"sceneId":"longmarch","name":"长征","year":"1934—1936","place":"瑞金出发","x":0.6180939226519337,"y":0.8047882136279927,"model":"ar-models/longmarch-object.glb","detailModel":"ar-models/longmarch-scene.glb","modelScale":0.105,"rotation":"0 0 0","summary":"关注红军长征的路线、组织与互助。","introduction":"长征是中国工农红军进行的一次伟大战略转移。1934年10月，中央红军从中央苏区出发，经历湘江战役、遵义会议、四渡赤水以及翻越雪山、穿越草地等重要历程。1935年10月，中央红军到达陕北；1936年10月，红军三大主力会师，长征胜利结束。雪山与草地见证着严寒、饥饿中的战友互助。遗址与实物见证着坚定信念、实事求是和团结奋斗的精神。","introSource":"https://news.12371.cn/2014/10/15/ARTI1413359340883737.shtml"},{"sceneId":"zunyi","name":"遵义会议","year":"1935","place":"贵州遵义","x":0.28591160220994477,"y":0.6850828729281768,"model":"ar-models/zunyi-house.glb","modelScale":0.06,"rotation":"0 0 0","placeholder":true,"summary":"在历史转折中理解会议的讨论与决定。","introduction":"1935年1月15日至17日，中共中央政治局扩大会议在贵州遵义召开。会议集中讨论军事和组织问题，总结第五次反“围剿”失败以及长征初期受挫的经验教训，纠正错误的军事指挥，调整中央领导机构。遵义会议在危急关头推动了中国革命的重大转折，为红军继续长征创造了重要条件。会址与文献记录着独立自主解决问题的探索，启示人们坚持实事求是，在实践中修正认识。","introSource":"https://news.12371.cn/2015/01/07/ARTI1420595886046625.shtml"},{"sceneId":"yanan","name":"延安","year":"1935—1948","place":"陕北 / 延安","x":0.3715469613259669,"y":0.35267034990791896,"model":"ar-models/baota-hill.glb","modelScale":0.06,"rotation":"0 0 0","placeholder":true,"summary":"走近陕北岁月中的生产、学习与革命实践。","introduction":"延安及陕甘宁边区是中国革命的重要指导中心和后方。1935年中央红军到达陕北，1937年中共中央机关迁驻延安。在这里，党领导抗日斗争，开展整风和大生产运动，培养干部，积累根据地建设经验。窑洞和革命旧址见证了干部群众的学习、劳动与生活。延安精神所包含的坚定政治方向、实事求是、为人民服务和自力更生。保护旧址与文物，让历史经验持续传承。","introSource":"https://news.12371.cn/2015/04/14/ARTI1428979044992134.shtml"},{"sceneId":"xibaipo","name":"西柏坡","year":"1948—1949","place":"河北平山","x":0.5290055248618785,"y":0.29097605893186,"model":"ar-models/xibaipo-house.glb","modelScale":0.06,"rotation":"0 0 0","placeholder":true,"summary":"认识胜利前夕的指挥与工作转变。","introduction":"西柏坡位于河北平山，是中共中央在解放战争后期的重要驻地。1948年，中央领导机关在这里开展工作，指挥辽沈、淮海、平津三大战役。1949年3月，党的七届二中全会在西柏坡召开，讨论全国胜利后的工作任务，提出保持谦虚谨慎、不骄不躁和艰苦奋斗作风的要求。院落、会议旧址与电报，记录着胜利前夕的谋划与责任。这段历史提醒人们保持清醒，密切联系群众。","introSource":"https://news.12371.cn/2013/07/16/ARTI1373943858130581.shtml"},{"sceneId":"founding","name":"开国大典","year":"1949","place":"北京","x":0.6277624309392266,"y":0.20718232044198895,"model":"ar-models/founding.glb","modelScale":0.06,"rotation":"0 0 0","placeholder":true,"summary":"从广场上的公共记忆见证新中国成立。","introduction":"1949年10月1日，中华人民共和国成立典礼在北京天安门广场举行。毛泽东向世界宣告中华人民共和国中央人民政府成立，五星红旗升起，随后举行阅兵和群众游行。这一历史时刻标志着新中国的诞生，也凝聚着长期革命斗争中无数人的努力与牺牲。典礼影像与文献承载着珍贵的公共记忆。回望开国大典，有助于理解民族独立、人民解放与国家建设的联系，珍惜和平生活。","introSource":"https://www.12371.cn/special/ghgjs/"}],"embeddedImage":"history-assets/red-history-map.png"}</script>

l-panel h2{font:20px 'Microsoft YaHei',sans-serif;margin:0}.ar-detail-panel button{width:44px;height:44px;border:1px solid #b39161;border-radius:50%;color:#8b342c;background:transparent;font-size:26px}.ar-detail-stage{height:min(48dvh,420px);min-height:150px;touch-action:none;outline:none}.ar-detail-stage canvas{display:block;width:100%;height:100%}.ar-detail-status,.ar-detail-hint{font:12px/1.5 'Microsoft YaHei',sans-serif;text-align:center;margin:5px 12px}.ar-detail-hint{margin-bottom:16px;color:#8b735b}.ar-detail-panel :focus-visible{outline:3px solid #af812f;outline-offset:-3px}\r\n@media(max-height:500px){.ar-detail-stage{height:48dvh;min-height:100px}.ar-detail-panel header{padding:4px 12px}.ar-detail-hint{margin-bottom:6px}}\r\n@media(prefers-reduced-motion:reduce){#arDetailOverlay,.ar-detail-panel,#arContainer{transition:none}}\r\n\r\nbody.is-detail-open #arProgress{filter:blur(5px);opacity:.35}\r\n/* 模型区保持独立手势；介绍区允许浏览器原生纵向滚动，避免与模型旋转冲突。 */\r\n.ar-detail-panel{max-height:min(76dvh,680px);display:flex;flex-direction:column}.ar-detail-panel header{flex-shrink:0}.ar-detail-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.ar-detail-stage{height:min(38dvh,340px)}.ar-detail-intro{margin:18px 22px 24px;padding-top:14px;border-top:1px solid #b79c6a55;touch-action:pan-y}.ar-detail-intro h3{font:600 16px/1.5 'Microsoft YaHei',sans-serif;margin:0 0 10px;color:#8e332b}.ar-detail-intro p{font:14px/1.9 'Microsoft YaHei',sans-serif;margin:0;color:#5a4c3e;text-align:justify;overflow-wrap:anywhere}\r\n@media(max-height:500px){.ar-detail-panel{max-height:82dvh}.ar-detail-stage{height:40dvh}.ar-detail-intro{margin:12px 16px 18px}}\r\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"arContainer\">\u003c/div>\u003cscript id=\"ar-data\" type=\"application/json\">{\"image\":\"history-assets/red-history-map.png\",\"displayImage\":\"history-assets/red-history-map-display.jpg\",\"target\":\"history-assets/red-history-map.mind\",\"width\":1448,\"height\":1086,\"events\":[{\"sceneId\":\"redboat\",\"name\":\"红船\",\"year\":\"1921\",\"place\":\"嘉兴南湖\",\"x\":0.7672651933701657,\"y\":0.5616942909760589,\"model\":\"ar-models/redboat-object.glb\",\"detailModel\":\"ar-models/redboat-scene.glb\",\"modelScale\":0.105,\"rotation\":\"0 0 0\",\"summary\":\"中共一大在南湖完成议程。\",\"introduction\":\"嘉兴南湖是中国共产党诞生的重要纪念地。1921年，中共一大在上海召开，会议受到干扰后，代表们转移到南湖的一艘游船上继续议程，完成大会议程。红船见证了建党这一历史起点，也承载着开天辟地、敢为人先的首创精神，坚定理想、百折不挠的奋斗精神，立党为公、忠诚为民的奉献精神。保护相关遗址、文献与实物，有助于理解初心使命，传承红色记忆。\",\"introSource\":\"https://www.12371.cn/special/zgjs/hcjs/\"},{\"sceneId\":\"jinggangshan\",\"name\":\"井冈山\",\"year\":\"1927\",\"place\":\"井冈山\",\"x\":0.5290055248618785,\"y\":0.7403314917127072,\"model\":\"ar-models/jinggangshan-object.glb\",\"detailModel\":\"ar-models/jinggangshan-scene.glb\",\"modelScale\":0.1,\"rotation\":\"0 0 0\",\"summary\":\"从革命根据地的开创走近井冈山精神。\",\"introduction\":\"井冈山地处湘赣边界，是中国革命的重要根据地。1927年秋，毛泽东率领秋收起义部队来到这里，探索建立农村革命根据地。1928年，朱德、陈毅率领的部队与毛泽东领导的部队在井冈山会师。在艰苦条件下，军民开展武装斗争、土地革命和根据地建设，逐步积累农村包围城市、武装夺取政权的实践经验。旧居与日常器物记录着军民互助、艰苦奋斗的岁月。\",\"introSource\":\"https://www.12371.cn/2022/04/01/ARTI1648804146759909.shtml\"},{\"sceneId\":\"longmarch\",\"name\":\"长征\",\"year\":\"1934—1936\",\"place\":\"瑞金出发\",\"x\":0.6180939226519337,\"y\":0.8047882136279927,\"model\":\"ar-models/longmarch-object.glb\",\"detailModel\":\"ar-models/longmarch-scene.glb\",\"modelScale\":0.105,\"rotation\":\"0 0 0\",\"summary\":\"关注红军长征的路线、组织与互助。\",\"introduction\":\"长征是中国工农红军进行的一次伟大战略转移。1934年10月，中央红军从中央苏区出发，经历湘江战役、遵义会议、四渡赤水以及翻越雪山、穿越草地等重要历程。1935年10月，中央红军到达陕北；1936年10月，红军三大主力会师，长征胜利结束。雪山与草地见证着严寒、饥饿中的战友互助。遗址与实物见证着坚定信念、实事求是和团结奋斗的精神。\",\"introSource\":\"https://news.12371.cn/2014/10/15/ARTI1413359340883737.shtml\"},{\"sceneId\":\"zunyi\",\"name\":\"遵义会议\",\"year\":\"1935\",\"place\":\"贵州遵义\",\"x\":0.28591160220994477,\"y\":0.6850828729281768,\"model\":\"ar-models/zunyi-house.glb\",\"modelScale\":0.06,\"rotation\":\"0 0 0\",\"placeholder\":true,\"summary\":\"在历史转折中理解会议的讨论与决定。\",\"introduction\":\"1935年1月15日至17日，中共中央政治局扩大会议在贵州遵义召开。会议集中讨论军事和组织问题，总结第五次反“围剿”失败以及长征初期受挫的经验教训，纠正错误的军事指挥，调整中央领导机构。遵义会议在危急关头推动了中国革命的重大转折，为红军继续长征创造了重要条件。会址与文献记录着独立自主解决问题的探索，启示人们坚持实事求是，在实践中修正认识。\",\"introSource\":\"https://news.12371.cn/2015/01/07/ARTI1420595886046625.shtml\"},{\"sceneId\":\"yanan\",\"name\":\"延安\",\"year\":\"1935—1948\",\"place\":\"陕北 / 延安\",\"x\":0.3715469613259669,\"y\":0.35267034990791896,\"model\":\"ar-models/baota-hill.glb\",\"modelScale\":0.06,\"rotation\":\"0 0 0\",\"placeholder\":true,\"summary\":\"走近陕北岁月中的生产、学习与革命实践。\",\"introduction\":\"延安及陕甘宁边区是中国革命的重要指导中心和后方。1935年中央红军到达陕北，1937年中共中央机关迁驻延安。在这里，党领导抗日斗争，开展整风和大生产运动，培养干部，积累根据地建设经验。窑洞和革命旧址见证了干部群众的学习、劳动与生活。延安精神所包含的坚定政治方向、实事求是、为人民服务和自力更生。保护旧址与文物，让历史经验持续传承。\",\"introSource\":\"https://news.12371.cn/2015/04/14/ARTI1428979044992134.shtml\"},{\"sceneId\":\"xibaipo\",\"name\":\"西柏坡\",\"year\":\"1948—1949\",\"place\":\"河北平山\",\"x\":0.5290055248618785,\"y\":0.29097605893186,\"model\":\"ar-models/xibaipo-house.glb\",\"modelScale\":0.06,\"rotation\":\"0 0 0\",\"placeholder\":true,\"summary\":\"认识胜利前夕的指挥与工作转变。\",\"introduction\":\"西柏坡位于河北平山，是中共中央在解放战争后期的重要驻地。1948年，中央领导机关在这里开展工作，指挥辽沈、淮海、平津三大战役。1949年3月，党的七届二中全会在西柏坡召开，讨论全国胜利后的工作任务，提出保持谦虚谨慎、不骄不躁和艰苦奋斗作风的要求。院落、会议旧址与电报，记录着胜利前夕的谋划与责任。这段历史提醒人们保持清醒，密切联系群众。\",\"introSource\":\"https://news.12371.cn/2013/07/16/ARTI1373943858130581.shtml\"},{\"sceneId\":\"founding\",\"name\":\"开国大典\",\"year\":\"1949\",\"place\":\"北京\",\"x\":0.6277624309392266,\"y\":0.20718232044198895,\"model\":\"ar-models/founding.glb\",\"modelScale\":0.06,\"rotation\":\"0 0 0\",\"placeholder\":true,\"summary\":\"从广场上的公共记忆见证新中国成立。\",\"introduction\":\"1949年10月1日，中华人民共和国成立典礼在北京天安门广场举行。毛泽东向世界宣告中华人民共和国中央人民政府成立，五星红旗升起，随后举行阅兵和群众游行。这一历史时刻标志着新中国的诞生，也凝聚着长期革命斗争中无数人的努力与牺牲。典礼影像与文献承载着珍贵的公共记忆。回望开国大典，有助于理解民族独立、人民解放与国家建设的联系，珍惜和平生活。\",\"introSource\":\"https://www.12371.cn/special/ghgjs/\"}]}\u003c/script>\u003cscript>/* 在MindAR滤波之外按帧平滑位置、四元数和尺度。始终跟随实时目标；丢失即隐藏。 */\nwindow.createHistoryARStabi   }catch(error){status(error.message)}
 }
 async function sendScene(sceneId){if(!allowed.has(sceneId)||!connection?.open)return false;const id=crypto.randomUUID();return new Promise(resolve=>{const timer=setTimeout(()=>{pending.delete(id);status('电脑未确认跳转，请检查电脑连接。手机将继续进入全景。');resolve(false)},2500);pending.set(id,{resolve,timer});try{connection.send({type:'scene',sceneId,id})}catch{clearTimeout(timer);pending.delete(id);resolve(false)}})}
 $('historyPairHost').onclick=()=>connect(true);$('historyPairJoin').onclick=()=>connect(false);$('historyPairDisconnect').onclick=disconnect;
 window.redHistoryPair={sendScene,disconnect,isConnected:()=>!!connection?.open};window.addEventListener('pagehide',disconnect);
})();

</script>
<!-- HISTORY-MAP-END --><script>const mapData=JSON.parse(document.getElementById('history-map-data').textContent);let demoViewer=null;function panorama(name){const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=1024;const ctx=canvas.getContext('2d'),g=ctx.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#b4a484');g.addColorStop(.6,'#66332b');g.addColorStop(1,'#261b18');ctx.fillStyle=g;ctx.fillRect(0,0,2048,1024);ctx.fillStyle='#fff1c8';ctx.font='46px serif';ctx.textAlign='center';ctx.fillText(name+' · 全景占位',1024,510);return canvas.toDataURL()}const demoScenes=Object.fromEntries([...mapData.events,{sceneId:'museum',name:'展览厅'},{sceneId:'present',name:'现代中国'}].map(e=>[e.sceneId,{type:'equirectangular',panorama:panorama(e.name),autoLoad:true}]));if(window.pannellum)demoViewer=pannellum.viewer('demoPanorama',{default:{firstScene:'museum',autoLoad:true,showControls:true},scenes:demoScenes});window.redHistoryMap.setHooks({onNavigate:id=>{if(demoViewer)demoViewer.loadScene(id);document.getElementById('demoTitle').textContent=demoScenes[id]?((mapData.events.find(e=>e.sceneId===id)||{name:id==='museum'?'展览厅':'现代中国'}).name):id}});document.querySelectorAll('#demoTimeline button').forEach(b=>b.onclick=()=>window.redHistoryMap.open());</script></body></html>
